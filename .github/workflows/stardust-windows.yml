# Unsigned Windows x64 NSIS installer for the public fork.
# Manual only. No GitHub Release, no signing, no Clerk/relay secrets.
#
# Upstream packages Windows on Linux with cargo-xwin (release-desktop.yml) and
# patches electron-builder so NSIS does not need Wine. This job follows that
# path on a free GitHub-hosted runner.
name: Stardust Windows

# workflow_dispatch is the intended trigger. GitHub only registers that event
# once the file is on the default branch, and this fork must not receive a
# main push. A push of this branch is the only way to start the job here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Defaults to ci/stardust-windows."
        type: string
        default: ci/stardust-windows
  push:
    branches:
      - ci/stardust-windows

permissions:
  contents: read

jobs:
  installer:
    name: Windows x64 NSIS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      # actions/checkout's credential cleanup walks orphaned gitlinks under .repos.
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          git rev-parse --short=12 HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: |
          set -euo pipefail
          npm install --global corepack@latest
          corepack enable
          corepack prepare "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")" --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:desktop compiles the Linux browser-secret helper before packing
      # the Electron main, even for a Windows artifact. Apple Speech no-ops
      # off macOS. The helper is not staged into the Windows package.
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm libsecret-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        run: |
          set -euo pipefail
          cargo xwin build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-pc-windows-msvc
          test -f native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe

      - name: Build unsigned NSIS installer
        env:
          T3CODE_DESKTOP_PLATFORM: win
          T3CODE_DESKTOP_TARGET: nsis
          T3CODE_DESKTOP_ARCH: x64
          T3CODE_DESKTOP_VERSION: "0.1.11"
          T3CODE_DESKTOP_OUTPUT_DIR: release/stardust-windows
          T3CODE_DESKTOP_SIGNED: "false"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_TELEMETRY_ENABLED: "false"
          VITE_RELEASE_CHANNEL: stable
          T3CODE_DESKTOP_WEB_ASSET_BRAND: production
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          unset T3CODE_CLERK_PUBLISHABLE_KEY || true
          unset T3CODE_CLERK_JWT_TEMPLATE || true
          unset T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || true
          unset T3CODE_RELAY_URL || true
          node scripts/build-desktop-artifact.ts

      - name: Write SHA256
        run: |
          set -euo pipefail
          out="release/stardust-windows"
          mapfile -t exes < <(find "$out" -maxdepth 1 -type f -name '*.exe' | sort)
          if [[ ${#exes[@]} -ne 1 ]]; then
            echo "expected exactly one installer exe, found ${#exes[@]}"
            find "$out" -maxdepth 2 -type f -printf '%s %p\n' || true
            exit 1
          fi
          sha256sum "${exes[0]}" | tee "$out/SHA256SUMS.txt"
          ls -lh "${exes[0]}"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stardust-windows-x64
          path: |
            release/stardust-windows/*.exe
            release/stardust-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
